name: Deploy Backend to AWS EC2

on:
  push:
    branches:
      - main
    paths:
      - 'backend/express-api/**'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend/express-api
          file: ./backend/express-api/Dockerfile
          push: true
          tags: |
            ishan1012/wellnest-backend:latest
            ishan1012/wellnest-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script: |
            # Pull the latest image
            sudo docker pull ishan1012/wellnest-backend:latest
            
            # Stop and remove the old container if it exists
            sudo docker rm -f wellnest-backend || true
            
            # Run the new container
            # We use the existing .env file in the directory
            sudo docker run -d \
              --name wellnest-backend \
              -p 5000:5000 \
              --env-file ~/express-api/.env \
              --restart unless-stopped \
              ishan1012/wellnest-backend:latest
            
            # Clean up old/unused Docker images
            sudo docker image prune -f