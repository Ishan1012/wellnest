services:
  express-api:
    image: Ishan1012/wellnest-backend # The image you pushed to Docker Hub
    restart: always
    env_file:
      - .env
    # We don't strictly need to expose port 5000 to the public, 
    # Nginx will talk to it internally via the docker network.

  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - express-api
